services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra_hw4
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=AdTechCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cql:/cql
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cassandra_data: